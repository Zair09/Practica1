name: Integracion Continua - Notificacion

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar programa Hola Mundo
        run: node index.js

      - name: Enviar notificacion a ntfy
        run: |
          curl -H "Title: Nuevo Push en main 🚀" \
               -H "Priority: high" \
               -d "Se ha realizado un push a la rama main del repositorio." \
               https://ntfy.sh/devops-itla
